<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全方位資產戰情室 (Pro Max版)</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        body { font-family: 'Segoe UI', -apple-system, sans-serif; background-color: #0d1117; color: #c9d1d9; padding: 20px; max-width: 1200px; margin: 0 auto; }
        .grid { display: grid; grid-template-columns: 3fr 1fr; gap: 20px; align-items: start; }
        .card { background-color: #161b22; padding: 25px; border-radius: 12px; border: 1px solid #30363d; box-shadow: 0 8px 24px rgba(0,0,0,0.2); }
        
        .tabs { display: flex; gap: 10px; margin-bottom: 25px; border-bottom: 1px solid #30363d; padding-bottom: 15px; }
        .tab-btn { background: transparent; color: #8b949e; border: 1px solid transparent; padding: 10px 20px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        .tab-btn:hover { background: #21262d; color: #c9d1d9; }
        .tab-btn.active { background: #1f6feb; color: white; border-color: #1f6feb; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
        th, td { padding: 14px 10px; text-align: right; border-bottom: 1px solid #21262d; }
        th { color: #8b949e; font-weight: 600; font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; }
        th:first-child, td:first-child { text-align: left; }
        tbody tr { transition: background-color 0.2s ease; }
        tbody tr:hover { background-color: #1c2128; } 

        .coin-name { font-weight: bold; color: #58a6ff; font-size: 16px; white-space: nowrap; }
        .badge { padding: 6px 10px; border-radius: 6px; font-weight: 600; font-size: 13px; display: inline-block; min-width: 70px; text-align: center; }
        .profit-badge { background-color: rgba(46, 160, 67, 0.15); color: #3fb950; border: 1px solid rgba(46, 160, 67, 0.4); }
        .loss-badge { background-color: rgba(248, 81, 73, 0.1); color: #ff7b72; border: 1px solid rgba(248, 81, 73, 0.4); }
        .neutral-badge { background-color: rgba(139, 148, 158, 0.1); color: #8b949e; border: 1px solid rgba(139, 148, 158, 0.4); }
        .tag-badge { background: #30363d; color: #c9d1d9; font-size: 11px; padding: 4px 6px; border-radius: 4px; margin-left: 8px;}

        .percent-label { display: block; font-size: 11px; margin-top: 2px; font-weight: normal; opacity: 0.9; }

        .summary-stats { text-align: right; }
        .summary-stats h2 { margin: 5px 0; font-size: 24px; font-weight: bold; color: #fff; }
        .summary-stats h3 { margin: 8px 0; font-size: 16px; font-weight: normal; color: #8b949e; }
        .total-number { font-weight: bold; font-family: 'Courier New', Courier, monospace; letter-spacing: -0.5px; }

        .form-group { margin-bottom: 10px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap;}
        input, select { padding: 10px; border-radius: 6px; border: 1px solid #30363d; background: #0d1117; color: #c9d1d9; outline: none; transition: 0.3s; }
        input[type="datetime-local"] { font-family: 'Segoe UI', sans-serif; }
        input:disabled { background-color: #21262d; color: #8b949e; cursor: not-allowed; border-color: #21262d; }
        input:focus:not(:disabled), select:focus { border-color: #58a6ff; }
        button.action-btn { background: #238636; color: white; cursor: pointer; font-weight: bold; border: none; padding: 10px 18px; border-radius: 6px; transition: 0.2s; }
        button.action-btn:hover { background: #2ea043; }
        
        .table-scroll-container { max-height: 400px; overflow-y: auto; overflow-x: auto; border: 1px solid #30363d; border-radius: 8px; }
        thead th { position: sticky; top: 0; background-color: #161b22; z-index: 1; }

        .sort-btn { background: #21262d; border: 1px solid #30363d; color: #c9d1d9; padding: 6px 12px; font-size: 13px; border-radius: 6px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 5px;}
        .sort-btn:hover { background: #30363d; color: #fff; }

        .autocomplete-item { padding: 10px 15px; cursor: pointer; border-bottom: 1px solid #21262d; font-size: 13px; color: #c9d1d9; transition: background 0.2s; }
        .autocomplete-item:hover { background-color: #1f6feb; color: white; }
        .autocomplete-item:last-child { border-bottom: none; }
        .autocomplete-highlight { color: #58a6ff; font-weight: bold; }        
        @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } .tabs { overflow-x: auto; white-space: nowrap; } }
        }

        #login-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: rgba(13, 17, 23, 0.95);
            backdrop-filter: blur(5px);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .login-box {
            background-color: #161b22;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #30363d;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            text-align: center;
            width: 300px;
            box-sizing: border-box;
        }
        .login-box h2 {
            margin-top: 0;
            color: #e0e0e0;
        }
        .login-box input {
            width: 100%;
            padding: 10px;
            margin: 15px 0;
            background-color: #0d1117;
            border: 1px solid #30363d;
            color: #e0e0e0;
            border-radius: 6px;
            box-sizing: border-box;
            outline: none;
        }
        .login-box input:focus {
            border-color: #58a6ff;
        }
        .login-box button {
            width: 100%;
            padding: 10px;
            background-color: #238636;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }
        .login-box button:hover {
            background-color: #2ea043;
        }
        #login-error {
            color: #ff7b72;
            font-size: 13px;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>

    <div id="login-overlay">
        <div class="login-box">
            <h2>🔒 Dashboard Login</h2>
            <input type="password" id="pwd-input" placeholder="請輸入密碼" onkeypress="if(event.key === 'Enter') attemptLogin()">
            <button onclick="attemptLogin()">解鎖 (Unlock)</button>
            <div id="login-error">密碼錯誤，請重新輸入。</div>
        </div>
    </div>

    <h1 style="text-align: center; margin-bottom: 20px; font-weight: 800; letter-spacing: 1px;">🚀 戰情室 Dashboard</h1>
    
    <div class="tabs" id="nav-tabs">
        <button class="tab-btn" onclick="switchTab('tw_stock')">🇹🇼 台股</button>
        <button class="tab-btn" onclick="switchTab('us_stock')">🇺🇸 美股</button>
        <button class="tab-btn active" onclick="switchTab('crypto')">🪙 加密貨幣</button>
        <button class="tab-btn" onclick="switchTab('all')">🌐 綜合分析</button>
    </div>
    
    <div id="dashboard-content" style="transition: opacity 0.2s ease-in-out, transform 0.2s ease-in-out; opacity: 1; transform: translateY(0);">
    <div class="card" id="form-card" style="margin-bottom: 25px;">
        <h3 id="form-title" style="margin-top:0; margin-bottom: 20px;">➕ 新增交易紀錄</h3>
        
        <div class="form-group" style="padding-bottom: 20px; border-bottom: 1px dashed #30363d; margin-bottom: 20px;">
            <input type="datetime-local" id="trade-date" title="修改交易時間" style="display: none;">
            <select id="trade-type"><option value="buy">買入 (Buy)</option><option value="sell">賣出 (Sell)</option></select>
            
            <div style="display: flex; align-items: center; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; padding-right: 5px; transition: 0.3s;" onmouseover="this.style.borderColor='#58a6ff'" onmouseout="this.style.borderColor='#30363d'">
                <select id="trade-coin" onchange="toggleDeleteButton()" style="width: 140px; padding: 10px; border: none; background: #0d1117; color: #c9d1d9; outline: none; cursor: pointer;"></select>
                <button id="delete-ticker-btn" onclick="deleteCustomTicker()" type="button" style="background: transparent; border: none; color: #8b949e; cursor: pointer; padding: 5px 8px; font-size: 14px; display: none; transition: 0.2s;" title="移除此自訂標的" onmouseover="this.style.color='#ff7b72'" onmouseout="this.style.color='#8b949e'">✖</button>
            </div>

            <input type="number" id="trade-amount" placeholder="數量 (例: 100)" step="any" style="width: 130px;">
            <input type="number" id="trade-price" placeholder="單價" step="any" style="width: 130px;">
            <button id="save-btn" class="action-btn" onclick="saveTrade()">儲存</button>
            <button id="cancel-btn" class="action-btn" onclick="cancelEdit()" style="background: #30363d; display: none;">取消</button>
        </div>

        <div style="display: flex; align-items: center; gap: 12px;">
            <span style="font-size: 13px; color: #8b949e;">請直接輸入代號：</span>
            <input type="text" id="new-ticker-input" placeholder="輸入代號 (例: AAPL, 00919)" autocomplete="off" style="width: 240px; padding: 10px 12px; border-radius: 6px; border: 1px solid #30363d; background: #0d1117; color: #c9d1d9; outline: none;">
            <button onclick="addNewTicker()" type="button" class="sort-btn" style="padding: 10px 18px; background: rgba(88, 166, 255, 0.1); border: 1px solid #58a6ff; color: #58a6ff; font-weight: bold;">➕ 加入選單</button>
        </div>
    </div>

    <div class="grid">
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h3 style="margin-top:0;" id="summary-title">📊 資產與獲利明細</h3>
                <span id="api-status" style="font-size: 12px; font-weight:bold; color: #8b949e; background: #21262d; padding: 6px 10px; border-radius: 4px;">⏳ 正在連線至雲端資料庫...</span>
            </div>
            <div style="width: 100%; overflow-x: auto; padding-bottom: 5px;">
                <table>
                    <thead id="summary-header-row"></thead>
                    <tbody id="summary-body"></tbody>
                </table>
            </div>
            
            <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-top: 20px; padding-top: 15px; border-top: 1px solid #30363d;">
                <div id="exchange-rate-container" style="text-align: left;">
                    <div style="font-size: 12px; color: #8b949e; margin-bottom: 8px;">
                        💱 雲端即時匯率：1 USD = <span id="current-ex-rate" style="color: #c9d1d9; font-weight: bold;">讀取中...</span> TWD
                    </div>
                    <div style="display: flex; gap: 10px;">
                        <button class="sort-btn" id="currency-toggle-btn" onclick="toggleGlobalCurrency()">🔄 切換為 TWD 計價</button>
                        <button class="sort-btn" id="hide-zero-btn" onclick="toggleZeroHoldings()">🙈 隱藏未持有標的</button>
                    </div>
                </div>

                <div class="summary-stats">
                    <h2>總現值: <span id="total-value" class="total-number" style="color: #58a6ff;">$0.00</span> 
                        <span id="exchange-note" style="font-size: 14px; color: #8b949e; font-weight:normal;">(以 USD 計價)</span>
                    </h2>
                    <h3>未實現總損益: <span id="total-unrealized" class="badge neutral-badge">$0.00</span></h3>
                    <h3>累計已實現損益: <span id="total-realized" class="badge neutral-badge">$0.00</span></h3>
                </div>
            </div>
        </div>
        
        <div class="card" style="display: flex; flex-direction: column; gap: 25px;">
            <div style="display: flex; justify-content: center; margin-bottom: 5px; z-index: 10;">
                <button class="sort-btn" id="pie-mode-btn" onclick="togglePieChartMode()" style="display: none; padding: 6px 12px; font-size: 12px; border-color: #58a6ff; color: #58a6ff;">🔄 圓餅圖：看大類資產</button>
            </div>

            <div style="width: 100%;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px;">
                    <h3 style="margin: 0; font-size: 16px; color: #e0e0e0;">📊 現值佔比分佈</h3>
                    <label style="font-size: 12px; color: #8b949e; cursor: pointer; display: flex; align-items: center; gap: 4px;">
                        <input type="checkbox" id="show-cash-toggle" onchange="toggleShowCash()" checked>
                        <span>含現金</span>
                    </label>
                </div>
                <div style="width: 100%; max-width: 250px; margin: 0 auto; position: relative;">
                    <canvas id="portfolioChart" style="position: relative; z-index: 2;"></canvas>
                    <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; pointer-events: none; width: 80%; z-index: 1;">
                        <div style="font-size: 11px; color: #8b949e; margin-bottom: 2px;">總現值</div>
                        <div style="font-size: 15px; font-weight: bold; color: #e0e0e0; margin-bottom: 2px;" id="portfolio-center-main">-</div>
                        <div style="font-size: 11px; color: #8b949e;" id="portfolio-center-alt">-</div>
                    </div>
                </div>
                <div id="portfolio-legend" style="display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 12px; margin: 10px auto 0; max-width: 250px; font-size: 13px; color: #c9d1d9;"></div>
            </div>
            <div style="width: 100%; height: 1px; background-color: #30363d;"></div>
            <div style="width: 100%;">
                <h3 style="margin: 0 0 5px 0; font-size: 16px; color: #e0e0e0;">💰 投入資金佔比</h3>
                <div style="width: 100%; max-width: 250px; margin: 0 auto; position: relative;">
                    <canvas id="costChart" style="position: relative; z-index: 2;"></canvas>
                    <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; pointer-events: none; width: 80%; z-index: 1;">
                        <div style="font-size: 11px; color: #8b949e; margin-bottom: 2px;">總成本</div>
                        <div style="font-size: 15px; font-weight: bold; color: #e0e0e0; margin-bottom: 2px;" id="cost-center-main">-</div>
                        <div style="font-size: 11px; color: #8b949e;" id="cost-center-alt">-</div>
                    </div>
                </div>
                <div id="cost-legend" style="display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 12px; margin: 10px auto 0; max-width: 250px; font-size: 13px; color: #c9d1d9;"></div>
            </div>
        </div>
    </div>

    <div class="card" style="margin-top: 25px; display: none;" id="trend-card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px;">
            <h3 style="margin: 0;">📈 總資產走勢 (Trend)</h3>
            <select id="trend-time-filter" onchange="updateTrendChart()" style="padding: 6px 10px; font-size: 13px; border-radius: 6px; border: 1px solid #30363d; background: #21262d; color: #c9d1d9; outline: none; cursor: pointer;">
                <option value="all">全部時間</option>
                <option value="1d">一天</option>
                <option value="1w">一週</option>
                <option value="1m">一個月</option>
                <option value="6m">半年</option>
                <option value="1y">一年</option>
            </select>
        </div>
        <div style="width: 100%; height: 280px;">
            <canvas id="trendChart"></canvas>
        </div>
    </div>

    <div class="card" style="margin-top: 25px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px;">
            <h3 style="margin:0;">📜 交易歷史 (Log)</h3>
            <div style="display: flex; gap: 10px; align-items: center;">
                <select id="history-category-filter" onchange="resetHistoryCoinFilter(); renderDashboardUI()" style="display: none; padding: 6px 10px; font-size: 13px; border-radius: 6px; border: 1px solid #30363d; background: #21262d; color: #c9d1d9; outline: none; cursor: pointer;">
                    <option value="all">全部類別</option>
                    <option value="tw_stock">台股</option>
                    <option value="us_stock">美股</option>
                    <option value="crypto">加密貨幣</option>
                </select>
                <select id="history-filter" onchange="renderDashboardUI()" style="padding: 6px 10px; font-size: 13px; border-radius: 6px; border: 1px solid #30363d; background: #21262d; color: #c9d1d9; outline: none; cursor: pointer;">
                    <option value="all">全部標的</option>
                </select>
                <button class="sort-btn" id="sort-toggle-btn" onclick="toggleSortOrder()">⏳ 最新交易在前</button>
            </div>
        </div>
        <div class="table-scroll-container">
            <table>
                <thead><tr id="history-header-row"></tr></thead>
                <tbody id="history-body"></tbody>
            </table>
        </div>
    </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbyZHgi0_RNXa0KcXI4BvUpxA16V1M8508hkw5sy4NdDjs9nYu1RvTh6jhoTBLtZmvyWIg/exec"; 

        let trades = [];
        let priceCache = {}; 
        let cashTWD = 0; 
        let stableCoinUSD = 0; 
        let cashUSD = 0; // 【新增】美金現金變數
        let snapshots = []; 
        let currentTab = 'crypto'; 
        let editingId = null; 
        let chartInstance = null;
        let costChartInstance = null;
        let trendChartInstance = null; 
        let sortOrder = 'desc'; 

        let currentExchangeRate = 32.5;
        let tabHideZero = JSON.parse(localStorage.getItem('wealthHideZeroTabs')) || { 'tw_stock': false, 'us_stock': false, 'crypto': false, 'all': false };
        let tabCurrencies = JSON.parse(localStorage.getItem('wealthCurrencies')) || { 'tw_stock': 'TWD', 'us_stock': 'USD', 'crypto': 'USD', 'all': 'USD' };    
        let pieChartMode = localStorage.getItem('wealthPieMode') || 'detail'; 
        let showCashInValueChart = localStorage.getItem('wealthShowCashInVal') ? JSON.parse(localStorage.getItem('wealthShowCashInVal')) : true;
        let wealthPwd = localStorage.getItem('wealthPwd') || '';

        function attemptLogin() {
            const input = document.getElementById('pwd-input').value;
            if(input) {
                wealthPwd = input;
                localStorage.setItem('wealthPwd', wealthPwd);
                document.getElementById('login-overlay').style.display = 'none';
                document.getElementById('login-error').style.display = 'none';
                syncWithCloud();
            }
        }

        function showLogin(showError = false) {
            document.getElementById('login-overlay').style.display = 'flex';
            document.getElementById('login-error').style.display = showError ? 'block' : 'none';
            localStorage.removeItem('wealthPwd');
            wealthPwd = '';
        }

        function resetHistoryCoinFilter() {
            const coinFilter = document.getElementById('history-filter');
            if (coinFilter) coinFilter.value = 'all';
        }

        // 【新增】美金的專屬顏色
        const predefinedColors = { 'BTC': '#f7931a', 'ETH': '#627eea', 'ADA': '#0033ad', '2330': '#d32f2f', '0050': '#1976d2', '現金': '#3fb950', 'USDT/USDC': '#26a17b', '美金': '#2ea043' };
        const apiIds = { 'BTC': 'bitcoin', 'ETH': 'ethereum', 'ADA': 'cardano' };
        const categoryNames = { 'tw_stock': '台股', 'us_stock': '美股', 'crypto': '加密貨幣', 'all': '綜合分析' };

        const categoryOptions = {
            'tw_stock': [{ value: '2330', text: '2330 (台積電)' }, { value: '0050', text: '0050 (元大台灣50)' }],
            'us_stock': [{ value: 'CRCL', text: 'CRCL' }, { value: 'NVDA', text: 'NVDA' }, { value: 'QQQ', text: 'QQQ' }, { value: 'TSLA', text: 'TSLA' }, { value: 'VOO', text: 'VOO' }],
            'crypto': [{ value: 'BTC', text: 'BTC (比特幣)' }, { value: 'ETH', text: 'ETH (以太幣)' }, { value: 'ADA', text: 'ADA (Cardano)' }]
        };

        const formatMoney = (num, decimals = 2, currency = 'USD') => {
            const symbol = currency === 'TWD' ? 'NT$' : '$';
            return symbol + num.toLocaleString('en-US', {minimumFractionDigits: decimals, maximumFractionDigits: decimals});
        };
        const formatAmount = (num) => num.toLocaleString('en-US', {maximumFractionDigits: 5});
        
        const formatDisplayDate = (dateStr) => {
            try {
                const d = new Date(dateStr);
                if (isNaN(d.getTime())) return dateStr; 
                return d.toLocaleString('zh-TW', { 
                    hour12: false, year: 'numeric', month: '2-digit', day: '2-digit', 
                    hour: '2-digit', minute: '2-digit', second: '2-digit' 
                }).replace(/-/g, '/');
            } catch(e) { return dateStr; }
        };

        function formatInputDate(dateStr) {
            try { const d = dateStr ? new Date(dateStr) : new Date(); const tzoffset = d.getTimezoneOffset() * 60000; return new Date(d - tzoffset).toISOString().slice(0, 16); } 
            catch(e) { return new Date().toISOString().slice(0, 16); }
        }

        function stringToColor(str) {
            if (predefinedColors[str.toUpperCase()]) return predefinedColors[str.toUpperCase()];
            let hash = 0;
            for (let i = 0; i < str.length; i++) { hash = str.charCodeAt(i) + ((hash << 5) - hash); }
            let color = '#';
            for (let i = 0; i < 3; i++) { 
                let value = (hash >> (i * 8)) & 0xFF;
                value = Math.max(value, 80); 
                color += ('00' + value.toString(16)).substr(-2);
            }
            return color;
        }

        function setStatus(msg, type) {
            const el = document.getElementById('api-status');
            el.innerHTML = msg;
            if(type === 'loading') el.style.color = '#f7931a';
            if(type === 'success') el.style.color = '#3fb950';
            if(type === 'error') el.style.color = '#ff7b72';
        }

        function updateCoinDropdown(category) {
            const coinSelect = document.getElementById('trade-coin');
            coinSelect.innerHTML = '';
            
            let allOptions = [];
            if (categoryOptions[category]) {
                allOptions = [...categoryOptions[category]];
            }

            let customTickers = JSON.parse(localStorage.getItem('wealthCustomTickers')) || { 'tw_stock': [], 'us_stock': [], 'crypto': [] };
            if (customTickers[category]) {
                customTickers[category].forEach(ticker => {
                    if (!allOptions.find(opt => opt.value === ticker)) {
                        allOptions.push({ value: ticker, text: ticker });
                    }
                });
            }

            allOptions.forEach(opt => {
                const optionElement = document.createElement('option');
                optionElement.value = opt.value;
                optionElement.innerText = opt.text;
                coinSelect.appendChild(optionElement);
            });

        async function syncWithCloud() {
            if (!wealthPwd) { showLogin(); return; }
            try {
                setStatus('⏳ 正在與 Google 雲端同步...', 'loading');
                const response = await fetch(`${API_URL}?pwd=${encodeURIComponent(wealthPwd)}`);
                
                let text = await response.text();
                let data;
                try { data = JSON.parse(text); } catch(e) { throw new Error("伺服器未回傳 JSON"); }
                if (data.error === "Unauthorized") {
                    showLogin(true);
                    setStatus('密碼錯誤', 'error');
                    return;
                }
                if (data.status === "error") throw new Error(data.message);

                let localTrades = JSON.parse(localStorage.getItem('wealthTrades')) || [];
                if (data.trades && data.trades.length === 0 && localTrades.length > 0) {
                    trades = localTrades;
                    await saveDataToCloud(true); 
                } else { trades = data.trades || []; }
                
                cashTWD = data.cashTWD || 0; 
                stableCoinUSD = data.stableCoinUSD || 0; 
                cashUSD = data.cashUSD || 0;

                snapshots = data.snapshots || [];

                localStorage.setItem('wealthTrades', JSON.stringify(trades));
                
                if (data.livePrices) {
                    Object.keys(data.livePrices).forEach(ticker => { 
                        priceCache[ticker] = data.livePrices[ticker]; 
                    });
                    if (data.livePrices['USD-TWD']) { 
                        currentExchangeRate = data.livePrices['USD-TWD']; 
                    }
                }
                
                setStatus('🟢 雲端資料庫同步完成', 'success');
                renderDashboardUI();
            } catch (error) {
                console.error(error);
                setStatus(`🔴 連線異常: ${error.message || '未知錯誤'}`, 'error');
                trades = JSON.parse(localStorage.getItem('wealthTrades')) || [];
                renderDashboardUI();
            }
        }

            localStorage.setItem('wealthTrades', JSON.stringify(trades));

            try {
                await fetch(API_URL, { method: 'POST', body: JSON.stringify({ pwd: wealthPwd, type: 'updateTrades', trades: trades }) });
                if(!isSilent) setStatus('🟢 成功儲存至 Google 雲端！', 'success');
            } catch (error) { setStatus('🔴 雲端儲存失敗，已暫存本機', 'error'); }
        }

            if (currentTab === 'tw_stock' && /^\d+$/.test(newTicker) && newTicker.length < 4) { newTicker = newTicker.padStart(4, '0'); }

            let customTickers = JSON.parse(localStorage.getItem('wealthCustomTickers')) || { 'tw_stock': [], 'us_stock': [], 'crypto': [] };
            if (!customTickers[currentTab]) customTickers[currentTab] = [];

                alert('這個標的已經在選單裡囉！');

                document.getElementById('trade-coin').value = newTicker;

        async function saveTrade() {
            const type = document.getElementById('trade-type').value;
            const coin = document.getElementById('trade-coin').value.trim().toUpperCase(); 
            const amount = parseFloat(document.getElementById('trade-amount').value);
            const price = parseFloat(document.getElementById('trade-price').value);
            const amountLabel = (currentTab === 'tw_stock' || currentTab === 'us_stock') ? '股數' : '數量';
            if(!coin || !amount || !price) { alert(`請填寫${amountLabel}與價格`); return; }
            if (!editingId) {
                const newId = Date.now().toString(); 
                const finalDate = new Date().toLocaleString('zh-TW', { hour12: false, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' }).replace(/-/g, '/');
                trades.push({ id: newId, category: currentTab, date: finalDate, type, coin, amount, price });
                document.getElementById('trade-amount').value = '';
                document.getElementById('trade-price').value = '';
            } else {
                const targetIndex = trades.findIndex(t => t.id === editingId);
                if (targetIndex > -1) {
                    const dateInput = document.getElementById('trade-date').value;
                    const finalDate = dateInput ? dateInput.replace('T', ' ') : new Date().toLocaleString('zh-TW', { hour12: false });
                    trades[targetIndex] = { ...trades[targetIndex], date: finalDate, type, coin, amount, price };
                }
                cancelEdit(); 
            }
            renderDashboardUI(); 
            await saveDataToCloud();
        }

        function renderDashboardUI() {
            const cashToggleEl = document.getElementById('show-cash-toggle');
            if(cashToggleEl) cashToggleEl.checked = showCashInValueChart;

            let globalCurrency = tabCurrencies[currentTab]; 
            trades.sort((a, b) => new Date(a.date) - new Date(b.date));
            document.getElementById('current-ex-rate').innerText = currentExchangeRate.toFixed(2);

            const hideBtn = document.getElementById('hide-zero-btn');
            if (hideBtn) {
                let isHidden = tabHideZero[currentTab];
                hideBtn.innerText = isHidden ? '🙉 顯示未持有標的' : '🙈 隱藏未持有標的';
                hideBtn.style.color = isHidden ? '#58a6ff' : '#c9d1d9';
                hideBtn.style.borderColor = isHidden ? '#58a6ff' : '#30363d';
            }

            let filteredTrades = currentTab === 'all' ? [...trades] : trades.filter(t => t.category === currentTab);
            
            let categoryFilterSelect = document.getElementById('history-category-filter');
            let currentCategoryFilter = 'all';
            if (categoryFilterSelect) {
                categoryFilterSelect.style.display = currentTab === 'all' ? 'inline-block' : 'none';
                currentCategoryFilter = categoryFilterSelect.value;
            }

            let historyFilterSelect = document.getElementById('history-filter');
            let currentFilter = historyFilterSelect ? historyFilterSelect.value : 'all';
            
            let dropdownTrades = currentTab === 'all' && currentCategoryFilter !== 'all' 
                ? filteredTrades.filter(t => t.category === currentCategoryFilter) 
                : filteredTrades;
                
            let uniqueCoins = [...new Set(dropdownTrades.map(t => t.coin))].sort();
            
            if (currentFilter !== 'all' && !uniqueCoins.includes(currentFilter)) {
                currentFilter = 'all';
            }
            
            if (historyFilterSelect) {
                let filterOptionsHTML = `<option value="all">全部標的</option>`;
                uniqueCoins.forEach(coin => {
                    let isSelected = coin === currentFilter ? 'selected' : '';
                    filterOptionsHTML += `<option value="${coin}" ${isSelected}>${coin}</option>`;
                });
                historyFilterSelect.innerHTML = filterOptionsHTML;
            }

            let portfolio = {};
            let tradesForDisplay = [];

            filteredTrades.forEach(t => {
                if (!portfolio[t.coin]) { portfolio[t.coin] = { amt: 0, cost: 0, realized: 0, category: t.category }; }
                let realizedPnL = null; 
                if(t.type === 'buy') {
                    portfolio[t.coin].amt += t.amount;
                    portfolio[t.coin].cost += (t.amount * t.price);
                } else {
                    if (portfolio[t.coin].amt > 0) {
                        let avgCost = portfolio[t.coin].cost / portfolio[t.coin].amt;
                        realizedPnL = (t.price - avgCost) * t.amount;
                        portfolio[t.coin].realized += realizedPnL;
                        portfolio[t.coin].amt -= t.amount;
                        portfolio[t.coin].cost -= (t.amount * avgCost);
                    } else { realizedPnL = 0; }
                }
                tradesForDisplay.push({ ...t, realizedPnL: realizedPnL });
            });

            const summaryHeaderRow = document.getElementById('summary-header-row');
            let summaryAmtHeader = (currentTab === 'tw_stock' || currentTab === 'us_stock') ? '總股數' : (currentTab === 'all' ? '股數/持倉' : '總持倉');
            summaryHeaderRow.innerHTML = `<tr><th>資產代號</th><th>${summaryAmtHeader}</th><th>平均成本</th><th>即時價</th><th>現值</th><th>未實現損益 (總漲跌幅)</th><th>累計已實現</th></tr>`;

            const historyHeaderRow = document.getElementById('history-header-row');
            let historyAmtHeader = (currentTab === 'tw_stock' || currentTab === 'us_stock') ? '股數' : '數量';
            if(currentTab === 'all') {
                historyHeaderRow.innerHTML = `<th>時間</th><th>動作</th><th>代號</th><th>分類</th><th>${historyAmtHeader}</th><th>成交單價</th><th>總額</th><th>已實現利潤</th>`;
            } else {
                historyHeaderRow.innerHTML = `<th>時間</th><th>動作</th><th>代號</th><th>${historyAmtHeader}</th><th>成交單價</th><th>總額</th><th>已實現利潤</th><th style="text-align: center;">操作</th>`;
            }

            const historyBody = document.getElementById('history-body');

            let finalHistoryTrades = tradesForDisplay;
            let finalCategoryFilter = document.getElementById('history-category-filter') ? document.getElementById('history-category-filter').value : 'all';
            
            if (currentTab === 'all' && finalCategoryFilter !== 'all') {
                finalHistoryTrades = finalHistoryTrades.filter(t => t.category === finalCategoryFilter);
            }
            if (currentFilter !== 'all') {
                finalHistoryTrades = finalHistoryTrades.filter(t => t.coin === currentFilter);
            }
            
            let sortedTrades = sortOrder === 'desc' ? [...finalHistoryTrades].reverse() : [...finalHistoryTrades]; 
            
            historyBody.innerHTML = sortedTrades.map((t) => {
                let itemCurrency = t.category === 'tw_stock' ? 'TWD' : 'USD';
                let logCurrency = globalCurrency;
                let logPrice = t.price;
                let logRealized = t.realizedPnL;
                if (globalCurrency === 'USD' && itemCurrency === 'TWD') {
                    logPrice /= currentExchangeRate; if (logRealized !== null) logRealized /= currentExchangeRate;
                } else if (globalCurrency === 'TWD' && itemCurrency === 'USD') {
                    logPrice *= currentExchangeRate; if (logRealized !== null) logRealized *= currentExchangeRate;
                }
                let precision = (t.coin === 'NIGHT') ? 5 : ((t.coin === 'BTC' || t.coin === 'ETH' || logCurrency === 'TWD' || t.category === 'us_stock') ? 2 : 4);
                let pnlBadge = '<span class="badge neutral-badge">-</span>';
                if (t.type === 'sell' && logRealized !== null) {
                    let pnlClass = logRealized > 0 ? 'profit-badge' : (logRealized < 0 ? 'loss-badge' : 'neutral-badge');
                    let pnlSign = logRealized > 0 ? '+' : '';
                    pnlBadge = `<span class="badge ${pnlClass}">${pnlSign}${formatMoney(logRealized, 2, logCurrency)}</span>`;
                }
                let typeBadge = t.type === 'buy' ? '<span style="color:#3fb950; font-weight:bold;">買入</span>' : '<span style="color:#ff7b72; font-weight:bold;">賣出</span>';
                let categoryCellHTML = currentTab === 'all' ? `<td><span class="tag-badge">${categoryNames[t.category] || t.category}</span></td>` : '';
                let actionCellHTML = currentTab === 'all' ? '' : `<td style="text-align: center;">
                    <button onclick="editTrade('${t.id}')" style="background:transparent; color:#58a6ff; border:1px solid #58a6ff; padding:4px 8px; font-size:12px; margin-bottom: 2px;">修改</button>
                    <button onclick="deleteTrade('${t.id}')" style="background:transparent; color:#ff7b72; border:1px solid #ff7b72; padding:4px 8px; font-size:12px;">刪除</button>
                </td>`;

                return `<tr>

        function updateTrendChart() {
            let globalCurrency = tabCurrencies[currentTab]; 
            
            if (trendChartInstance) trendChartInstance.destroy();
            const ctx = document.getElementById('trendChart').getContext('2d');

            let sortedSnaps = [...snapshots].sort((a,b) => new Date(a.date) - new Date(b.date));

            const timeFilterEl = document.getElementById('trend-time-filter');
            const filterValue = timeFilterEl ? timeFilterEl.value : 'all';

            let savedFilters = JSON.parse(localStorage.getItem('wealthTrendFilters')) || {};
            savedFilters[currentTab] = filterValue;
            localStorage.setItem('wealthTrendFilters', JSON.stringify(savedFilters));

            if (filterValue !== 'all' && sortedSnaps.length > 0) {
                const latestDate = new Date(sortedSnaps[sortedSnaps.length - 1].date);
                let cutoffTime = 0;

                if (filterValue === '1d') {
                    cutoffTime = latestDate.getTime() - (24 * 60 * 60 * 1000); 
                } else if (filterValue === '1w') {
                    cutoffTime = latestDate.getTime() - (7 * 24 * 60 * 60 * 1000); 
                } else if (filterValue === '1m') {
                    cutoffTime = latestDate.getTime() - (30 * 24 * 60 * 60 * 1000); 
                } else if (filterValue === '6m') {
                    cutoffTime = latestDate.getTime() - (183 * 24 * 60 * 60 * 1000); 
                } else if (filterValue === '1y') {
                    cutoffTime = latestDate.getTime() - (365 * 24 * 60 * 60 * 1000); 
                }

                sortedSnaps = sortedSnaps.filter(s => new Date(s.date).getTime() >= cutoffTime);
            }

            let labels = sortedSnaps.map(s => {
                let d = new Date(s.date);
                return `${d.getMonth()+1}/${d.getDate()} ${d.getHours().toString().padStart(2, '0')}:00`;
            });

            let sortedTrades = [...trades].sort((a,b) => new Date(a.date) - new Date(b.date));
            let tradeIndex = 0;
            let histPortfolio = {};

            sortedSnaps.forEach(s => {
                let sDate = new Date(s.date).getTime();
                
                while(tradeIndex < sortedTrades.length && new Date(sortedTrades[tradeIndex].date).getTime() <= sDate) {
                    let t = sortedTrades[tradeIndex];
                    if (!histPortfolio[t.coin]) histPortfolio[t.coin] = { amt: 0, cost: 0 };
                    
                    if(t.type === 'buy') {
                        histPortfolio[t.coin].amt += t.amount;
                        histPortfolio[t.coin].cost += (t.amount * t.price);
                    } else if(t.type === 'sell') {
                        if (histPortfolio[t.coin].amt > 0) {
                            let avgCost = histPortfolio[t.coin].cost / histPortfolio[t.coin].amt;
                            histPortfolio[t.coin].amt -= t.amount;
                            histPortfolio[t.coin].cost -= (t.amount * avgCost);
                        }
                    }
                    tradeIndex++;
                }

                let histExRate = s.total_usd > 0 ? (s.total_twd / s.total_usd) : globalExRate;
                let histAssetCostUSD = 0;
                let histCostCat = { crypto_usd: 0, tw_stock_twd: 0, us_stock_usd: 0 };

                for (let coin in histPortfolio) {
                    if (histPortfolio[coin].amt > 0) {
                        let tRef = sortedTrades.find(tr => tr.coin === coin);
                        let cat = tRef ? tRef.category : '';
                        let costVal = histPortfolio[coin].cost; 
                        
                        if (cat === 'tw_stock') histCostCat.tw_stock_twd += costVal;
                        else if (cat === 'crypto') histCostCat.crypto_usd += costVal;
                        else if (cat === 'us_stock') histCostCat.us_stock_usd += costVal;
                        
                        if (cat === 'tw_stock') histAssetCostUSD += (costVal / histExRate);
                        else histAssetCostUSD += costVal;
                    }
                }

                let impliedCashUSD = s.total_usd - s.crypto_usd - s.tw_stock_usd - s.us_stock_usd;
                s.hist_cost_usd = histAssetCostUSD + impliedCashUSD + stableCoinUSD + cashUSD;
                s.hist_cost_twd = s.hist_cost_usd * histExRate;
                
                s.hist_cost_crypto_usd = histCostCat.crypto_usd + stableCoinUSD;
                s.hist_cost_crypto_twd = (histCostCat.crypto_usd + stableCoinUSD) * histExRate;
                s.hist_cost_tw_stock_twd = histCostCat.tw_stock_twd;
                s.hist_cost_tw_stock_usd = histCostCat.tw_stock_twd / histExRate;
                s.hist_cost_us_stock_usd = histCostCat.us_stock_usd + cashUSD;
                s.hist_cost_us_stock_twd = (histCostCat.us_stock_usd + cashUSD) * histExRate;
            });

            let hiddenState = JSON.parse(localStorage.getItem('wealthTrendLegend')) || {};
            let datasets = [];

            if (currentTab === 'all') {
                datasets = [
                    {
                        label: `現金 (${globalCurrency})`,
                        data: sortedSnaps.map(s => {
                            let total = globalCurrency === 'USD' ? s.total_usd : s.total_twd;
                            let crypto = globalCurrency === 'USD' ? s.crypto_usd : s.crypto_twd;
                            let tw = globalCurrency === 'USD' ? s.tw_stock_usd : s.tw_stock_twd;
                            let us = globalCurrency === 'USD' ? s.us_stock_usd : s.us_stock_twd;
                            let cashVal = total - crypto - tw - us;
                            return Math.round(cashVal * 100) / 100;
                        }),
                        borderColor: '#3fb950', 
                        backgroundColor: 'rgba(63, 185, 80, 0.4)', 
                        borderWidth: 2,
                        fill: true,
                        tension: 0.2, 
                        pointRadius: 0,
                        pointHoverRadius: 4,
                        stack: 'Stack 0',
                        hidden: hiddenState[`現金 (${globalCurrency})`] === true
                    },
                    {
                        label: `台股 (${globalCurrency})`,
                        data: sortedSnaps.map(s => globalCurrency === 'USD' ? s.tw_stock_usd : s.tw_stock_twd),
                        borderColor: '#d32f2f',
                        backgroundColor: 'rgba(211, 47, 47, 0.4)', 
                        borderWidth: 2,
                        fill: true,
                        tension: 0.2, 
                        pointRadius: 0,
                        pointHoverRadius: 4,
                        stack: 'Stack 0',
                        hidden: hiddenState[`台股 (${globalCurrency})`] === true
                    },
                    {
                        label: `美股 (${globalCurrency})`,
                        data: sortedSnaps.map(s => globalCurrency === 'USD' ? s.us_stock_usd : s.us_stock_twd),
                        borderColor: '#1976d2',
                        backgroundColor: 'rgba(25, 118, 210, 0.4)', 
                        borderWidth: 2,
                        fill: true,
                        tension: 0.2, 
                        pointRadius: 0,
                        pointHoverRadius: 4,
                        stack: 'Stack 0',
                        hidden: hiddenState[`美股 (${globalCurrency})`] === true
                    },
                    {
                        label: `加密貨幣 (${globalCurrency})`,
                        data: sortedSnaps.map(s => globalCurrency === 'USD' ? s.crypto_usd : s.crypto_twd),
                        borderColor: '#f7931a',
                        backgroundColor: 'rgba(247, 147, 26, 0.4)', 
                        borderWidth: 2,
                        fill: true,
                        tension: 0.2, 
                        pointRadius: 0,
                        pointHoverRadius: 4,
                        stack: 'Stack 0',
                        hidden: hiddenState[`加密貨幣 (${globalCurrency})`] === true
                    },
                    {
                        label: `累積投入本金 (含現金, ${globalCurrency})`,
                        data: sortedSnaps.map(s => globalCurrency === 'USD' ? s.hist_cost_usd : s.hist_cost_twd),
                        borderColor: '#ffffff',
                        borderDash: [5, 5],
                        borderWidth: 2,
                        fill: false,
                        tension: 0.2,
                        pointRadius: 0,
                        pointHoverRadius: 4,
                        stack: 'Stack 1',
                        order: -1,
                        hidden: hiddenState[`累積投入本金 (含現金, ${globalCurrency})`] === true
                    },
                    {
                        label: `總資產 (${globalCurrency})`,
                        data: sortedSnaps.map(s => globalCurrency === 'USD' ? s.total_usd : s.total_twd),
                        borderColor: '#58a6ff',
                        borderWidth: 2,
                        fill: false,
                        tension: 0.2,
                        pointRadius: 0,
                        pointHoverRadius: 4,
                        stack: 'Stack 2',
                        order: -2,
                        hidden: hiddenState[`總資產 (${globalCurrency})`] === true
                    }
                ];
            } else {
                let dataKey = '';
                let chartLabel = '';
                let chartColor = '#58a6ff'; 

                if (currentTab === 'crypto') {
                    dataKey = globalCurrency === 'USD' ? 'crypto_usd' : 'crypto_twd';
                    costDataKey = globalCurrency === 'USD' ? 'hist_cost_crypto_usd' : 'hist_cost_crypto_twd';
                    chartLabel = `加密貨幣走勢 (${globalCurrency})`;
                    chartColor = '#f7931a'; 
                } else if (currentTab === 'tw_stock') {
                    dataKey = globalCurrency === 'USD' ? 'tw_stock_usd' : 'tw_stock_twd';
                    costDataKey = globalCurrency === 'USD' ? 'hist_cost_tw_stock_usd' : 'hist_cost_tw_stock_twd';
                    chartLabel = `台股走勢 (${globalCurrency})`;
                    chartColor = '#d32f2f'; 
                } else if (currentTab === 'us_stock') {
                    dataKey = globalCurrency === 'USD' ? 'us_stock_usd' : 'us_stock_twd';
                    costDataKey = globalCurrency === 'USD' ? 'hist_cost_us_stock_usd' : 'hist_cost_us_stock_twd';
                    chartLabel = `美股走勢 (${globalCurrency})`;
                    chartColor = '#1976d2'; 
                }

                datasets = [{
                    label: chartLabel,
                    data: sortedSnaps.map(s => s[dataKey]),
                    borderColor: chartColor,
                    backgroundColor: chartColor + '1A', 
                    borderWidth: 2,
                    fill: true,
                    tension: 0.2, 
                    pointBackgroundColor: chartColor,
                    pointBorderColor: '#fff',
                    pointRadius: 0,
                    pointHoverRadius: 4,
                    hidden: hiddenState[chartLabel] === true 
                },
                {
                    label: `累積投入本金 (${globalCurrency})`,
                    data: sortedSnaps.map(s => s[costDataKey] || 0),
                    borderColor: '#ffffff',
                    borderDash: [5, 5],
                    borderWidth: 2,
                    fill: false,
                    tension: 0.2,
                    pointRadius: 0,
                    pointHoverRadius: 4,
                    order: -1,
                    hidden: hiddenState[`累積投入本金 (${globalCurrency})`] === true
                }];
            }

            trendChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: datasets
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: {
                        mode: 'index',
                        intersect: false,
                    },
                    plugins: { 
                        legend: { 
                            display: true, 
                            labels: { color: '#c9d1d9', usePointStyle: true, boxWidth: 8 },
                            onClick: function(e, legendItem, legend) {
                                const index = legendItem.datasetIndex;
                                const ci = legend.chart;
                                
                                if (ci.isDatasetVisible(index)) {
                                    ci.hide(index);
                                    legendItem.hidden = true;
                                } else {
                                    ci.show(index);
                                    legendItem.hidden = false;
                                }
                                
                                let savedState = JSON.parse(localStorage.getItem('wealthTrendLegend')) || {};
                                savedState[legendItem.text] = legendItem.hidden;
                                localStorage.setItem('wealthTrendLegend', JSON.stringify(savedState));
                            }
                        }, 
                        tooltip: { 
                            callbacks: { 
                                label: function(c) { 
                                    return ` ${c.dataset.label}: ${formatMoney(c.parsed.y, 2, globalCurrency)}`;
                                },
                                afterBody: function(items) {
                                    let currentTotal = 0;
                                    let isAllTab = currentTab === 'all';
                                    
                                    // For 'all' tab, we only sum up Stack 0 (Area blocks) for the main Total. Cost is separate.
                                    items.forEach(i => {
                                        if (!isAllTab) {
                                            if (!i.dataset.label.includes("本金")) currentTotal += i.parsed.y;
                                        } else {
                                            if (i.dataset.stack === 'Stack 0') currentTotal += i.parsed.y;
                                        }
                                    });
                                    
                                    if (currentTotal === 0 && items.length > 0) {
                                        currentTotal = items[0].parsed.y; // fallback if only one item is hovered
                                    }
                                    
                                    let prevTotal = null;
                                    let index = items[0].dataIndex;
                                    if (index > 0) {
                                        prevTotal = 0;
                                        items.forEach(i => {
                                            if (!isAllTab) {
                                                if (!i.dataset.label.includes("本金")) prevTotal += i.dataset.data[index - 1];
                                            } else {
                                                if (i.dataset.stack === 'Stack 0') prevTotal += i.dataset.data[index - 1];
                                            }
                                        });
                                    }
                                    
                                    let footerStr = '';
                                    if (isAllTab) {
                                        footerStr += `\n------------------\n💰 總現值: ${formatMoney(currentTotal, 2, globalCurrency)}`;
                                        if (prevTotal !== null && prevTotal > 0) {
                                            let diff = currentTotal - prevTotal;
                                            let diffSign = diff >= 0 ? '+' : '';
                                            let diffIcon = diff >= 0 ? '📈' : '📉';
                                            let pct = (diff / prevTotal) * 100;
                                            footerStr += `\n${diffIcon} 較前次: ${diffSign}${formatMoney(diff, 2, globalCurrency)} (${diffSign}${pct.toFixed(2)}%)`;
                                        }
                                    }
                                    return footerStr;
                                }
                            } 
                        } 
                    },
                    scales: {
                        x: { stacked: currentTab === 'all', grid: { color: '#30363d' }, ticks: { color: '#8b949e', maxTicksLimit: 7 } },
                        y: { stacked: currentTab === 'all', grid: { color: '#30363d' }, ticks: { color: '#8b949e' } }
                    }
                }
            });
        }

        window.onload = () => {
            if (!wealthPwd) {
                showLogin();
            } else {
                document.getElementById('login-overlay').style.display = 'none';
                syncWithCloud();
            }
        };
        setInterval(syncWithCloud, 60000); 

    </script>
</body>
</html>
